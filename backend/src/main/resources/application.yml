server:
  port: 8080

spring:
  application:
    name: architecture-reviewer-backend

  # Spring Boot Docker Compose integration:
  # Automatically executes docker compose up when Spring Boot launches in IntelliJ,
  # configures PostgreSQL connection parameters dynamically, and handles lifecycle.
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-only
      readiness:
        tcp:
          read-timeout: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/arch_reviewer_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ai:
  engine:
    url: ${AI_ENGINE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
